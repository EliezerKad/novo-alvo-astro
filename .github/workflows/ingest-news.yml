name: Ingest editorial pitches

on:
  schedule:
    - cron: '*/45 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --progress=false

      - name: Ingest RSS into editorial pitches
        run: npm run ingest:news
        env:
          PORTAL_ORIGIN: https://portalnovoalvo.com.br
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          MAX_ITEMS_PER_FEED: 80
          MAX_PITCHES: 80
          MIN_SOURCES: 8
          MAX_ITEM_AGE_HOURS: 30
          RADAR_BATCHES_PER_CATEGORY: 3
          HOUSEKEEPING_DAYS: 30
