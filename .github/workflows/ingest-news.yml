name: Ingest editorial pitches

on:
  schedule:
    - cron: '*/45 * * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Categoria para ingest manual'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - Brasil
          - Politica
          - Mundo
          - Economia
          - Tecnologia
          - Entretenimento
          - Esportes
          - Ciencia
          - Saude
          - Famosos
          - Futebol
          - Games
          - Lifestyle
          - Educacao
          - Cultura
          - Moda
          - Musica
          - Cinema

jobs:
  ingest-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --progress=false

      - name: Ingest RSS into editorial pitches
        run: npm run ingest:news
        env:
          PORTAL_ORIGIN: https://portalnovoalvo.com.br
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          MAX_ITEMS_PER_FEED: 80
          MAX_PITCHES: 80
          CATEGORY_MAX_PITCHES: 8
          CATEGORY_MIN_SOURCES: 3
          INGEST_CATEGORY: ${{ inputs.category }}
          MIN_SOURCES: 8
          MAX_ITEM_AGE_HOURS: 30
          RADAR_BATCHES_PER_CATEGORY: 3
          HOUSEKEEPING_DAYS: 30

  ingest-scheduled:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        category:
          - Brasil
          - Politica
          - Mundo
          - Economia
          - Tecnologia
          - Entretenimento
          - Esportes
          - Ciencia
          - Saude
          - Famosos
          - Futebol
          - Games
          - Lifestyle
          - Educacao
          - Cultura
          - Moda
          - Musica
          - Cinema
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --progress=false

      - name: Ingest ${{ matrix.category }} RSS into editorial pitches
        run: npm run ingest:news
        env:
          PORTAL_ORIGIN: https://portalnovoalvo.com.br
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          MAX_ITEMS_PER_FEED: 80
          MAX_PITCHES: 80
          CATEGORY_MAX_PITCHES: 6
          CATEGORY_MIN_SOURCES: 3
          INGEST_CATEGORY: ${{ matrix.category }}
          MIN_SOURCES: 8
          MAX_ITEM_AGE_HOURS: 30
          RADAR_BATCHES_PER_CATEGORY: 3
          HOUSEKEEPING_DAYS: 30
