name: Ingest editorial pitches

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Categoria para ingest manual'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - Brasil
          - Politica
          - Mundo
          - Economia
          - Tecnologia
          - Entretenimento
          - Esportes
          - Ciencia
          - Saude
          - Famosos
          - Futebol
          - Games
          - Lifestyle
          - Educacao
          - Cultura
          - Moda
          - Musica
          - Cinema
          - Ocorrencias
      discovery:
        description: 'Motor de descoberta manual'
        required: false
        default: 'gnews'
        type: choice
        options:
          - gnews
          - rss
          - google_search

jobs:
  ingest-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --progress=false

      - name: Ingest editorial discovery into editorial pitches
        run: npm run ingest:news
        env:
          PORTAL_ORIGIN: https://portalnovoalvo.com.br
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
          INGEST_DISCOVERY: ${{ inputs.discovery }}
          GNEWS_QUERIES_PER_CATEGORY: 1
          GNEWS_MAX_RESULTS: 10
          GNEWS_REQUEST_DELAY_MS: 1200
          GNEWS_RETRY_DELAY_MS: 12000
          GOOGLE_SEARCH_PAGES_PER_QUERY: 1
          GOOGLE_SEARCH_QUERIES_PER_CATEGORY: 4
          MAX_ITEMS_PER_FEED: 80
          MAX_PITCHES: 80
          CATEGORY_MAX_PITCHES: 14
          ABSOLUTE_MIN_SOURCES: 8
          CATEGORY_MIN_SOURCES: 8
          CATEGORY_FLOOR_MIN_SOURCES: 8
          INGEST_CATEGORY: ${{ inputs.category }}
          MIN_SOURCES: 8
          MAX_ITEM_AGE_HOURS: 48
          RADAR_BATCHES_PER_CATEGORY: 5
          SOURCE_EXPANSION_TARGET: 16
          SOURCE_TEXT_TARGET: 15
          HOUSEKEEPING_DAYS: 30
