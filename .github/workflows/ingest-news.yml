name: Ingest editorial pitches

on:
  schedule:
    - cron: '*/45 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci --progress=false

      - name: Install asset extractor
        run: python -m pip install --disable-pip-version-check scrapling

      - name: Ingest RSS into editorial pitches
        run: npm run ingest:news
        env:
          PORTAL_ORIGIN: https://portalnovoalvo.com.br
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          MAX_ITEMS_PER_FEED: 80
          MAX_PITCHES: 80
          MIN_SOURCES: 8
          RADAR_BATCHES_PER_CATEGORY: 3
          ENABLE_SCRAPLING_ASSETS: 1
          SCRAPLING_SOURCE_LIMIT: 5
          SCRAPLING_TIMEOUT_MS: 14000
          SCRAPLING_MAX_PITCHES_PER_RUN: 18
          HOUSEKEEPING_DAYS: 30
