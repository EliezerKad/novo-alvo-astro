name: Ingest editorial pitches

on:
  schedule:
    - cron: '*/45 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci --progress=false

      - name: Install asset extractor
        run: |
          python -m pip install --disable-pip-version-check camoufox scrapling crawl4ai
          python -m camoufox fetch || true
          python -m playwright install chromium

      - name: Ingest RSS into editorial pitches
        run: npm run ingest:news
        env:
          PORTAL_ORIGIN: https://portalnovoalvo.com.br
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          MAX_ITEMS_PER_FEED: 80
          MAX_PITCHES: 80
          MIN_SOURCES: 8
          MAX_ITEM_AGE_HOURS: 30
          RADAR_BATCHES_PER_CATEGORY: 3
          CRAWL4AI_FIRST: 1
          CAMOUFOX_ENABLED: 1
          ENABLE_SCRAPLING_ASSETS: 1
          SCRAPLING_FIRST: 1
          SCRAPLING_SOURCE_LIMIT: 4
          SCRAPLING_TIMEOUT_MS: 65000
          SCRAPLING_MAX_PITCHES_PER_RUN: 12
          CAMOUFOX_SOURCE_LIMIT: 2
          CAMOUFOX_NAV_TIMEOUT_MS: 7000
          CAMOUFOX_IDLE_TIMEOUT_MS: 1500
          CAMOUFOX_SETTLE_MS: 250
          HOUSEKEEPING_DAYS: 30
